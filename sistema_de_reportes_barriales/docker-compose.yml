services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportes-barriales-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_to_a_long_random_entropy_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_PATH: /app/src/database/reportes_barriales.sqlite
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
    volumes:
      # Persistencia de la base de datos SQL y de las fotos subidas entre reinicios del contenedor
      - db_data:/app/src/database
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  uploads_data:
